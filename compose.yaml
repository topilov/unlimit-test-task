name: apm-investigator
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm
      POSTGRES_DB: apm
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - apm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm -d apm"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  apm-data:
